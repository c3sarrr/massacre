<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Régua de planta (rascunho)</title>
<style>
  body { margin: 0; background: #1f1a18; color: #F6F0E4; font: 12px system-ui, sans-serif; }
  #info { padding: 6px 8px; color: #E8D9A8; }
  canvas { display: block; margin: 4px 0 14px; }
</style>
<div id="info">carregando…</div>
<div id="faixas"></div>
<script type="module">
// Rascunho de estudo: foto do Commons lida só no canvas (nada vai para o disco), escala pelo comprimento real,
// boca do cano em x = 0 e eixo do cano em y = 0, grade em milímetros, faixas ampliadas e perfis de cima/baixo por mm.
import { sourceInfo, loadImage, weaponMask, largestComponent, traceLoops, area, simplify } from './lib.js';
const P = new URLSearchParams(location.search);
const FILE = P.get('arquivo');
const MM = Number(P.get('mm'));
const MIRROR = P.get('espelhar') === '1';
const PX = Number(P.get('pxmm') || 2.8);
const FAIXA = Number(P.get('faixa') || 220);
const info = document.getElementById('info');

async function run() {
  const src = await sourceInfo(FILE);
  const img = await loadImage(src.url);
  const W = img.naturalWidth;
  const H = img.naturalHeight;
  const cv = document.createElement('canvas');
  cv.width = W;
  cv.height = H;
  const g = cv.getContext('2d', { willReadFrequently: true });
  if (MIRROR) { g.translate(W, 0); g.scale(-1, 1); }
  g.drawImage(img, 0, 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  const { mask: raw, mode } = weaponMask(g.getImageData(0, 0, W, H), W, H);
  const mask = largestComponent(raw, W, H);
  const loops = traceLoops(mask, W, H).map((l) => ({ l, a: area(l) }));
  loops.sort((p, q) => Math.abs(q.a) - Math.abs(p.a));
  const outer = loops[0];
  let minX = Infinity, maxX = -Infinity;
  for (const [x] of outer.l) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); }
  const s = MM / (maxX - minX); // mm por pixel da foto
  let top = Infinity, bottom = -Infinity;
  const band = (maxX - minX) * 0.01;
  for (const [x, y] of outer.l) if (x >= maxX - band) { top = Math.min(top, y); bottom = Math.max(bottom, y); }
  let axisY = (top + bottom) / 2;
  // eixo pelo cano exposto: centro da primeira faixa de pixels (de cima) nas colunas pedidas (mm)
  if (P.has('eixox')) {
    const [a, b] = P.get('eixox').split(',').map(Number);
    const centros = [];
    for (let xm = a; xm <= b; xm += 2) {
      const px = Math.round(maxX + xm / s);
      let t = -1, e = -1;
      for (let y = 0; y < H; y++) {
        if (mask[y * W + px]) { if (t < 0) t = y; e = y; } else if (t >= 0) break;
      }
      if (t >= 0) centros.push({ c: (t + e) / 2, d: (e - t + 1) * s });
    }
    centros.sort((p, q) => p.c - q.c);
    const med = centros[centros.length >> 1];
    axisY = med.c;
    window.__cano = { diametroMM: +med.d.toFixed(2), amostras: centros.length };
  }
  const toMM = (x, y) => [(x - maxX) * s, -(y - axisY) * s];
  // perfis de cima e de baixo a cada mm
  const perfil = [];
  for (let xm = -MM; xm <= 0; xm += 1) {
    const px = Math.min(W - 1, Math.max(0, Math.round(maxX + xm / s)));
    let t = -1, b = -1;
    for (let y = 0; y < H; y++) if (mask[y * W + px]) { if (t < 0) t = y; b = y; }
    if (t >= 0) perfil.push([xm, +toMM(px, t)[1].toFixed(1), +toMM(px, b)[1].toFixed(1)]);
  }
  window.__perfil = perfil;
  window.__contorno = simplify(outer.l, 1.0).map(([x, y]) => toMM(x, y).map((v) => +v.toFixed(1)));
  window.__buracos = loops.slice(1).filter((h) => Math.abs(h.a) > Math.abs(outer.a) * 0.002 && Math.sign(h.a) !== Math.sign(outer.a))
    .map((h) => simplify(h.l, 1.0).map(([x, y]) => toMM(x, y).map((v) => +v.toFixed(1))));
  info.textContent = `${src.file} · ${src.license} · ${src.artist} · ${W}×${H} px · ${mode} · 1 px = ${s.toFixed(3)} mm · `
    + `boca ${((bottom - top) * s).toFixed(1)} mm de altura · buracos ${window.__buracos.length}`;
  // faixas ampliadas com grade
  const cont = document.getElementById('faixas');
  for (let x0 = -MM; x0 < 0; x0 += FAIXA) {
    const x1 = Math.min(0, x0 + FAIXA);
    let yMin = Infinity, yMax = -Infinity;
    for (const [xm, t, b] of perfil) if (xm >= x0 && xm <= x1) { yMin = Math.min(yMin, b); yMax = Math.max(yMax, t); }
    yMin = Math.floor((yMin - 12) / 10) * 10;
    yMax = Math.ceil((yMax + 12) / 10) * 10;
    const c = document.createElement('canvas');
    c.width = Math.round((x1 - x0 + 24) * PX);
    c.height = Math.round((yMax - yMin) * PX);
    const q = c.getContext('2d');
    const X = (xm) => (xm - x0 + 12) * PX;
    const Y = (ym) => (yMax - ym) * PX;
    q.fillStyle = '#e9e4da';
    q.fillRect(0, 0, c.width, c.height);
    // foto: pixel da foto -> mm -> tela
    const sx0 = maxX + (x0 - 12) / s;
    const sy0 = axisY - yMax / s;
    q.imageSmoothingQuality = 'high';
    q.drawImage(cv, sx0, sy0, c.width / PX / s, c.height / PX / s, 0, 0, c.width, c.height);
    for (let xm = Math.ceil((x0 - 12) / 10) * 10; xm <= x1 + 12; xm += 10) {
      const major = xm % 50 === 0;
      q.strokeStyle = major ? 'rgba(0,120,255,0.75)' : 'rgba(0,120,255,0.28)';
      q.lineWidth = major ? 1.2 : 0.7;
      q.beginPath(); q.moveTo(X(xm) + 0.5, 0); q.lineTo(X(xm) + 0.5, c.height); q.stroke();
      if (major) { q.fillStyle = '#0050d0'; q.font = 'bold 12px system-ui'; q.fillText(String(xm), X(xm) + 2, 12); }
    }
    for (let ym = yMin; ym <= yMax; ym += 10) {
      const major = ym % 50 === 0;
      q.strokeStyle = ym === 0 ? 'rgba(255,40,40,0.9)' : major ? 'rgba(0,160,80,0.75)' : 'rgba(0,160,80,0.28)';
      q.lineWidth = ym === 0 || major ? 1.2 : 0.7;
      q.beginPath(); q.moveTo(0, Y(ym) + 0.5); q.lineTo(c.width, Y(ym) + 0.5); q.stroke();
      if (major || ym === 0) { q.fillStyle = '#007a3c'; q.font = 'bold 12px system-ui'; q.fillText(String(ym), 2, Y(ym) - 2); }
    }
    const h = document.createElement('div');
    h.textContent = `faixa x ${x0} … ${x1} mm, y ${yMin} … ${yMax} mm`;
    cont.appendChild(h);
    cont.appendChild(c);
  }
  window.__pronto = true;
}
run().catch((err) => { info.textContent = 'erro: ' + err.message; window.__pronto = true; });
</script>
</html>
